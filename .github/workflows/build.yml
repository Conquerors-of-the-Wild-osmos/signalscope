name: Signalscope CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    outputs:
      artifact_name: ${{ steps.select_jar.outputs.filename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Find production JAR
        id: select_jar
        shell: bash
        run: |
          set -euo pipefail
          
          mapfile -t jars < <(
            find build/libs \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              | sort
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one production JAR."
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "${jars[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        id: upload_jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.select_jar.outputs.filename }}
          path: ${{ steps.select_jar.outputs.path }}
          retention-days: 7
          if-no-files-found: error


      - name: Comment PR with build artifact
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.upload_jar.outputs.artifact-url }}
          ARTIFACT_NAME: ${{ steps.select_jar.outputs.filename }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- signalscope-build-artifact -->';
            
            const body = `${marker}
            ## ✅ Signalscope build is ready
            
            **Artifact:** ${process.env.ARTIFACT_NAME}
            
            📦 [Download build artifact](${process.env.ARTIFACT_URL})
            
            **Commit:** \`${process.env.COMMIT_SHA.substring(0, 7)}\`
            
            _Built automatically by GitHub Actions._
            `;
            
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );
            
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            
              console.log('Updated existing PR comment.');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            
              console.log('Created PR comment.');
            }


      - name: Add download link to summary
        env:
          ARTIFACT_URL: ${{ steps.upload_jar.outputs.artifact-url }}
        run: |
          {
            echo "## Signalscope build"
            echo ""
            echo "[Download Signalscope JAR]($ARTIFACT_URL)"
            echo ""
            echo "Commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Minecraft Server
    runs-on: ubuntu-latest
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    concurrency:
      group: signalscope-production
      cancel-in-progress: false

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: deploy

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload mod
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            deploy/signalscope.jar \
            "$USER@$HOST:/var/lib/minecraft/mods/signalscope.jar.new"

      - name: Install mod and restart Minecraft
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            "mv /var/lib/minecraft/mods/signalscope.jar.new /var/lib/minecraft/mods/signalscope.jar && sudo -n systemctl restart minecraft"
