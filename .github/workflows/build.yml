name: Signalscope CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Signalscope
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.select_jar.outputs.filename }}
      artifact_url: ${{ steps.upload_jar.outputs.artifact-url }}
      mod_version: ${{ steps.read_mod_version.outputs.mod_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Find production JAR
        id: select_jar
        shell: bash
        run: |
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar'
          )

          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one production JAR, found ${#jars[@]}"
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "${jars[0]}")" >> "$GITHUB_OUTPUT"

      - name: Read mod version
        id: read_mod_version
        shell: bash
        env:
          JAR_PATH: ${{ steps.select_jar.outputs.path }}
        run: |
          version="$(unzip -p "$JAR_PATH" fabric.mod.json | jq -er '.version')"
          
          if [[ "$version" == *'$'* ]]; then
            echo "Mod version was not expanded in fabric.mod.json: $version"
            exit 1
          fi
          
          echo "Detected mod version: $version"
          echo "mod_version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        id: upload_jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.select_jar.outputs.filename }}
          path: ${{ steps.select_jar.outputs.path }}
          retention-days: 7
          if-no-files-found: error

  comment-pr:
    name: Publish build link in PR
    runs-on: ubuntu-latest

    needs: build

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      pull-requests: write

    steps:
      - name: Create or update PR comment
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- signalscope-build-artifact -->';

            const body = [
              marker,
              '## ✅ Signalscope build is ready',
              '',
              `**Artifact:** \`${process.env.ARTIFACT_NAME}\``,
              '',
              `📦 [Download build artifact](${process.env.ARTIFACT_URL})`,
              '',
              `**Commit:** \`${process.env.COMMIT_SHA.slice(0, 7)}\``
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );

            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  deploy:
    name: Deploy to Minecraft Server
    runs-on: ubuntu-latest

    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment:
      name: production
      deployment: false

    concurrency:
      group: signalscope-production
      cancel-in-progress: false

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: deploy

      - name: Deploy mod and restart Minecraft
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          JAR_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          scp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy/$JAR_NAME" \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/lib/minecraft/mods/signalscope.jar.new"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv /var/lib/minecraft/mods/signalscope.jar.new /var/lib/minecraft/mods/signalscope.jar && systemctl restart minecraft"

  release:
    name: Create or Update GitHub Release
    runs-on: ubuntu-latest

    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Clear stale release body on re-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.mod_version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes ""
            echo "::notice::Cleared existing release body for $TAG."
          else
            echo "No existing release for $TAG; creating fresh."
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          name: Signalscope v${{ needs.build.outputs.mod_version }}
          generate_release_notes: true
          files: release/${{ needs.build.outputs.artifact_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
