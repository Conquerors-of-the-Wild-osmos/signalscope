name: Signalscope CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Signalscope
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.select_jar.outputs.filename }}
      artifact_url: ${{ steps.upload_jar.outputs.artifact-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Find production JAR
        id: select_jar
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find build/libs \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              | sort
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one production JAR."
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "${jars[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        id: upload_jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.select_jar.outputs.filename }}
          path: ${{ steps.select_jar.outputs.path }}
          retention-days: 7
          if-no-files-found: error


  comment-pr:
    name: Publish build link in PR
    runs-on: ubuntu-latest

    needs: build

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      pull-requests: write

    steps:
      - name: Create or update PR comment
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- signalscope-build-artifact -->';

            const body = [
              marker,
              '## ✅ Signalscope build is ready',
              '',
              `**Artifact:** \`${process.env.ARTIFACT_NAME}\``,
              '',
              `📦 [Download build artifact](${process.env.ARTIFACT_URL})`,
              '',
              `**Commit:** \`${process.env.COMMIT_SHA.slice(0, 7)}\``
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );

            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  deploy:
    name: Deploy to Minecraft Server
    runs-on: ubuntu-latest

    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment:
      name: production

    concurrency:
      group: signalscope-production
      cancel-in-progress: false

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: deploy

      - name: Deploy mod and restart Minecraft
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          JAR_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          scp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy/$JAR_NAME" \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/lib/minecraft/mods/signalscope.jar.new"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv /var/lib/minecraft/mods/signalscope.jar.new /var/lib/minecraft/mods/signalscope.jar && systemctl restart minecraft"
