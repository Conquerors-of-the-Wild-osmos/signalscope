services:
  mc:
    image: itzg/minecraft-server:java21
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 1m

    ports:
      # Minecraft
      - "${MC_PORT:-25565}:25565/tcp"

      # Simple Voice Chat
      - "${VOICE_PORT:-24454}:24454/udp"

    environment:
      EULA: "${EULA:-TRUE}"

      TYPE: "FABRIC"
      VERSION: "1.21.1"

      MEMORY: "${MEMORY:-8G}"

      # Dependencies compatible with Fabric and Minecraft 1.21.1
      MODRINTH_PROJECTS: |
        fabric-api
        yacl
        simple-voice-chat

      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"

      # Download the latest published Signalscope release.
      MODS: "${SIGNALSCOPE_MODS-https://github.com/Conquerors-of-the-Wild-osmos/signalscope/releases/latest/download/signalscope-fabric.jar}"

    volumes:
      - ./data:/data
      - ./mods:/mods:ro